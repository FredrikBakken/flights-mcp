name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: jdx/mise-action@v4

      - name: Check the tag matches the project version
        # A mismatch here would publish artifacts whose filenames disagree with
        # the release, so fail loudly instead of shipping something confusing.
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(uv version --short)
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag '$tag' does not match project version '$version' (expected 'v$version')."
            exit 1
          fi

      - name: Run tests
        run: |
          uv sync --locked
          uv run pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Create or update the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
