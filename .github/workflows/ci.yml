name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Run prek hooks
        # `no-commit-to-branch` exists to block local commits to main; on a
        # push to main it would fail every run, so it is skipped here.
        run: prek run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Build sdist and wheel
        run: uv build

      - name: Verify the built server starts
        # The server speaks stdio and would block forever, so feed it EOF and
        # assert it got far enough to announce itself.
        run: |
          uv tool install ./dist/flights_mcp-*.whl
          output=$(printf '' | flights-mcp 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "flights-mcp"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
